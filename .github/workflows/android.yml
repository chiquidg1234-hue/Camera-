name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de depuración
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Resumen de errores
        if: failure()
        run: grep -E "^e: |What went wrong|^> " build.log | head -80 || true

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: GrabaFondo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
